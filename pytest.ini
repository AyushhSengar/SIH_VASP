[pytest]
# Quiet, deterministic test configuration.
#
# asyncio_mode = auto lets the async provider/API tests be written as plain
# `async def test_...` without an explicit marker on each one.
#
# asyncio_default_fixture_loop_scope is set explicitly because pytest-asyncio
# emits a deprecation warning when it is unset and will change the default in
# a future release. Pinning it to `function` keeps the current behaviour
# (a fresh event loop per test, so no HTTP client state leaks between tests)
# and makes the upgrade a no-op rather than a surprise.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests
